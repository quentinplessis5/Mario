<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kart Racer 3D</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
        user-select: none;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      #screens {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="hud"></div>
      <div id="screens"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
